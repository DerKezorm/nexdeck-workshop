nexdeck-card: 1
slug: sonarr-next-episodes
name: {en: Next episodes, de: Nächste Folgen}
version: 1.0.1
min_nexdeck: 0.51.0
description: The series of your Sonarr library that have an episode coming, with the day it airs, the nearest first. Every row has a button that asks Sonarr to search the missing episodes of that series.
category: media
requires: [sonarr]
requests:
  - id: series
    path: /api/v3/series
form: list
rows:
  select: "[?nextAiring]"
  sort: {field: nextAiring}
  limit: 10
item:
  title: title
  subtitle: network
  value: {path: nextAiring, format: datetime}
empty: {en: No episode is announced, de: Keine Folge angekündigt}
buttons:
  - id: search
    label: {en: Search missing, de: Fehlende suchen}
    icon: search
    where: row
    method: POST
    path: /api/v3/command
    body:
      name: SeriesSearch
      seriesId: "{id}"
demo:
  series:
  - {id: 5, title: Mountain Marble, network: Harbor TV, nextAiring: '2026-11-03T01:00:00Z'}
  - {id: 4, title: Cedar Lantern, network: Northlight, nextAiring: '2026-11-04T02:30:00Z'}
  - {id: 8, title: Garden Static, network: Harbor TV, nextAiring: '2026-11-10T00:00:00Z'}
  - {id: 2, title: Velvet Saltwater, network: Northlight, nextAiring: '2026-12-01T20:00:00Z'}
