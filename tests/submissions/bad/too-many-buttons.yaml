  - {id: b5, label: Button 5, method: POST, path: /api/queue/b5}
  - {id: b6, label: Button 6, method: POST, path: /api/queue/b6}
  - {id: b7, label: Button 7, method: POST, path: /api/queue/b7}
  - {id: b8, label: Button 8, method: POST, path: /api/queue/b8}
