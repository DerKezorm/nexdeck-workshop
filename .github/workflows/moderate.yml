name: moderate

# The commands of the comments: /remove and /restore (a maintainer), /withdraw (the author), /recheck (the author or a maintainer);
# and the manual removal of an entry. The person is taken from the event, never from what a comment says.
#
# GitHub drops a waiting run when a newer one comes in the same group, so no run counts on being the one for its event:
# a comment is carried out by the next run that finds it without the mark of the bot, and the inputs of a manual removal are
# first written to orders/ by a job of their own (its group is never shared, so it is never dropped).
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      entry:
        description: "The id of the entry, such as 123456/queue-size"
        required: true
      level:
        description: "How bad"
        type: choice
        options:
          - harmful
          - not_useful
        required: true
      reason:
        description: "The reason, in one sentence"
        required: true

permissions:
  contents: write
  issues: write
  discussions: write

jobs:
  record:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: workshop-order-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Write the order
        run: python -m tools.orders
        env:
          ENTRY: ${{ inputs.entry }}
          LEVEL: ${{ inputs.level }}
          REASON: ${{ inputs.reason }}
          SENDER: ${{ github.event.sender.id }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
      - name: Push
        run: bash .github/scripts/push.sh "Record an order to remove an entry"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The record job is the only one of a manual run that must not be dropped; the job after it does the work
  # (and so does any later run of any action, should this one be dropped).
  order:
    needs: [record]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: workshop-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r kit/requirements.txt -r requirements-render.txt
      - run: python -m playwright install --with-deps chromium
      - name: Carry out the orders and the commands
        run: python -m tools.work
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Push
        run: bash .github/scripts/push.sh "Update the workshop from a command"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Comment and close
        run: python -m tools.publish
        env:
          GITHUB_TOKEN: ${{ github.token }}

  comment:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.user.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/remove') || startsWith(github.event.comment.body, '/withdraw') || startsWith(github.event.comment.body, '/restore') || startsWith(github.event.comment.body, '/recheck'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: workshop-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r kit/requirements.txt -r requirements-render.txt
      - run: python -m playwright install --with-deps chromium
      - name: Carry out the orders and the commands
        run: python -m tools.work
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Push
        run: bash .github/scripts/push.sh "Update the workshop from a command"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Comment and close
        run: python -m tools.publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
