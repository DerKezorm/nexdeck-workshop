name: daily

# Once a day: counts the thumbs up of the discussions into the catalog, and takes up the submissions that waited
# (more than ten new entries from one account in a day, or a run that GitHub did not start).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  discussions: write

concurrency:
  group: workshop-write
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r kit/requirements.txt -r requirements-render.txt
      - run: python -m playwright install --with-deps chromium
      - name: Thumbs up and waiting submissions
        run: python -m tools.work --daily
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Push
        run: bash .github/scripts/push.sh "Daily update of the workshop"
      - name: Comment and close
        run: python -m tools.publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
